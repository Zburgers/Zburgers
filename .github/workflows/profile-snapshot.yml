name: Refresh profile snapshot

on:
  push:
    branches: [main]
    paths:
      - scripts/update_profile_snapshot.py
      - scripts/test_profile_snapshot.py
      - .github/workflows/profile-snapshot.yml
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test_profile_snapshot.py
      - run: python scripts/update_profile_snapshot.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/project-*.svg assets/github-snapshot.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(profile): refresh public snapshot"
          git push
