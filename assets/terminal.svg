<svg width="920" height="250" viewBox="0 0 920 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nakshatra's animated terminal profile</title>
  <desc id="desc">A terminal card describing Nakshatra as an AI systems engineer, product builder, and open-source contributor.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="920" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2388FF"/>
      <stop offset="0.5" stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2388FF"/>
    </linearGradient>
    <linearGradient id="scanGradient" x1="0" y1="0" x2="150" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58A6FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="1" y="1" width="918" height="248" rx="13"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .prompt { fill: #58A6FF; font-size: 15px; font-weight: 700; }
    .command { fill: #F0F6FC; font-size: 15px; }
    .output { fill: #B1BAC4; font-size: 15px; }
    .accent { fill: #79C0FF; font-size: 15px; font-weight: 600; }
    .muted { fill: #8B949E; font-size: 12px; }
    .line1 { animation: reveal 0.45s ease-out 0.15s both; }
    .line2 { animation: reveal 0.45s ease-out 0.55s both; }
    .line3 { animation: reveal 0.45s ease-out 0.95s both; }
    .line4 { animation: reveal 0.45s ease-out 1.35s both; }
    .line5 { animation: reveal 0.45s ease-out 1.75s both; }
    .line6 { animation: reveal 0.45s ease-out 2.15s both; }
    .cursor { animation: blink 1s steps(1, end) infinite; }
    .scan { animation: scan 7s linear infinite; }
    .status-dot { animation: pulse 1.8s ease-in-out infinite; transform-origin: center; }
    @keyframes reveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @keyframes scan { from { transform: translateX(-180px); } to { transform: translateX(1080px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.45; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) {
      .line1, .line2, .line3, .line4, .line5, .line6, .cursor, .scan, .status-dot { animation: none; }
    }
  </style>

  <rect x="0.75" y="0.75" width="918.5" height="248.5" rx="13.25" fill="#0D1117" stroke="url(#border)" stroke-width="1.5"/>
  <path d="M1 43.5H919" stroke="#30363D"/>
  <circle cx="23" cy="22" r="5" fill="#FF5F57"/>
  <circle cx="41" cy="22" r="5" fill="#FEBC2E"/>
  <circle cx="59" cy="22" r="5" fill="#28C840"/>
  <text x="460" y="27" text-anchor="middle" class="mono muted">nakshatra@fedora — profile</text>
  <circle cx="886" cy="22" r="4" fill="#3FB950" class="status-dot"/>
  <text x="874" y="26" text-anchor="end" class="mono muted">online</text>

  <g clip-path="url(#windowClip)">
    <rect class="scan" x="0" y="44" width="180" height="205" fill="url(#scanGradient)"/>
  </g>

  <g class="mono line1">
    <text x="24" y="76" class="prompt">nakshatra@fedora:~$</text>
    <text x="225" y="76" class="command">whoami</text>
  </g>
  <text x="24" y="101" class="mono output line2">AI systems engineer · product builder · open-source contributor</text>

  <g class="mono line3">
    <text x="24" y="135" class="prompt">nakshatra@fedora:~$</text>
    <text x="225" y="135" class="command">currently-building</text>
  </g>
  <text x="24" y="160" class="mono accent line4">Goofy Agent OS · VibeVoice · mdview · cb-connect</text>

  <g class="mono line5">
    <text x="24" y="194" class="prompt">nakshatra@fedora:~$</text>
    <text x="225" y="194" class="command">focus --now</text>
  </g>
  <text x="24" y="219" class="mono output line6">Reliable agents · local-first tools · reproducible AI systems</text>
  <rect x="598" y="205" width="9" height="17" rx="1" fill="#58A6FF" class="cursor"/>
</svg>
