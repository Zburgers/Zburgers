<svg width="920" height="18" viewBox="0 0 920 18" fill="none" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2388FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#2388FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .base { stroke: #30363D; }
    .runner { animation: travel 5.5s linear infinite; }
    .dot { animation: glow 1.8s ease-in-out infinite; transform-origin: center; }
    @keyframes travel { from { transform: translateX(-190px); } to { transform: translateX(1110px); } }
    @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-color-scheme: light) { .base { stroke: #D0D7DE; } }
    @media (prefers-reduced-motion: reduce) { .runner, .dot { animation: none; } }
  </style>
  <path class="base" d="M0 9H920" stroke-width="1"/>
  <g class="runner">
    <rect x="0" y="8" width="180" height="2" rx="1" fill="url(#shine)"/>
    <circle class="dot" cx="90" cy="9" r="3" fill="#58A6FF"/>
  </g>
</svg>
