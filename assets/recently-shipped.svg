<svg width="920" height="290" viewBox="0 0 920 290" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Recently shipped projects</title>
  <desc id="desc">Recent public releases from VibeVoice, FlashRL, and mdview. This card is refreshed automatically.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="920" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2388FF" stop-opacity="0.8"/>
      <stop offset="0.48" stop-color="#30363D"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58A6FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { fill: #F0F6FC; font-size: 20px; font-weight: 700; }
    .kicker { fill: #58A6FF; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
    .project { fill: #F0F6FC; font-size: 17px; font-weight: 700; }
    .version { fill: #79C0FF; font-size: 13px; font-weight: 700; }
    .body { fill: #B1BAC4; font-size: 12.5px; }
    .muted { fill: #8B949E; font-size: 11px; }
    .scanline { animation: travel 8s linear infinite; }
    .dot { animation: pulse 1.8s ease-in-out infinite; transform-origin: center; }
    @keyframes travel { from { transform: translateX(-200px); } to { transform: translateX(1120px); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .scanline, .dot { animation: none; } }
  </style>

  <rect x="0.75" y="0.75" width="918.5" height="288.5" rx="14" fill="#0D1117" stroke="url(#frame)" stroke-width="1.5"/>
  <rect class="scanline" x="0" y="1" width="180" height="288" fill="url(#scan)"/>
  <text x="28" y="38" class="mono kicker">RECENTLY SHIPPED</text>
  <text x="28" y="67" class="mono title">Public releases with runnable artifacts and evidence</text>
  <circle cx="881" cy="31" r="4" fill="#3FB950" class="dot"/>
  <text x="868" y="35" text-anchor="end" class="mono muted">AUTO-SYNC</text>

  <rect x="28" y="92" width="272" height="164" rx="11" fill="#161B22" stroke="#30363D"/>
  <text x="48" y="122" class="mono project">VibeVoice</text>
  <text x="48" y="146" class="mono version">v0.2.6</text>
  <text x="48" y="174" class="mono body">Local-first desktop dictation</text>
  <text x="48" y="195" class="mono body">with whisper.cpp and Tauri.</text>
  <text x="48" y="229" class="mono muted">Linux · Windows · macOS</text>

  <rect x="324" y="92" width="272" height="164" rx="11" fill="#161B22" stroke="#30363D"/>
  <text x="344" y="122" class="mono project">FlashRL</text>
  <text x="344" y="146" class="mono version">v2.0.0</text>
  <text x="344" y="174" class="mono body">Reproducible DQN benchmark</text>
  <text x="344" y="195" class="mono body">with held-out evaluation.</text>
  <text x="344" y="229" class="mono muted">Benchmark · checkpoint · demo</text>

  <rect x="620" y="92" width="272" height="164" rx="11" fill="#161B22" stroke="#30363D"/>
  <text x="640" y="122" class="mono project">mdview</text>
  <text x="640" y="146" class="mono version">latest stable</text>
  <text x="640" y="174" class="mono body">Fast local-first Markdown</text>
  <text x="640" y="195" class="mono body">reader with Mermaid support.</text>
  <text x="640" y="229" class="mono muted">Installers · updater · PDF</text>

  <text x="460" y="278" text-anchor="middle" class="mono muted">Daily workflow replaces this snapshot with the latest published GitHub releases.</text>
</svg>
