<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-labelledby="title desc">
<title id="title">Flappy Commit — the midnight arcade. Click to play.</title><desc id="desc">A golden bird flying over a layered midnight city beneath a warm moon, with moving green copper gates.</desc>
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#152339"/><stop offset="1" stop-color="#7c707e"/></linearGradient><linearGradient id="shade"><stop stop-color="#101c30"/><stop offset=".65" stop-color="#101c30" stop-opacity=".8"/><stop offset="1" stop-color="#101c30" stop-opacity="0"/></linearGradient><linearGradient id="copper"><stop stop-color="#355967"/><stop offset=".3" stop-color="#82a591"/><stop offset="1" stop-color="#355966"/></linearGradient><clipPath id="clip"><rect width="920" height="330" rx="15"/></clipPath></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.bird{animation:fly 1.6s ease-in-out infinite;transform-origin:590px 162px}.cloud{animation:drift 14s ease-in-out infinite alternate}.gates{animation:gates 9s linear infinite}@keyframes fly{50%{transform:translateY(-15px) rotate(-7deg)}}@keyframes drift{to{transform:translateX(-30px)}}@keyframes gates{to{transform:translateX(-130px)}}@media(prefers-reduced-motion:reduce){.bird,.cloud,.gates{animation:none}}</style>
