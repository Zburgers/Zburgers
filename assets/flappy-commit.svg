<g fill="#e4c796" opacity=".45"><path d="M534 223h4v7h-4zm13 0h4v7h-4zm-13 17h4v7h-4zm13 0h4v7h-4zM706 213h4v7h-4zm14 0h4v7h-4zm-14 18h4v7h-4zm14 0h4v7h-4zM814 238h4v7h-4zm14 0h4v7h-4zm-14 18h4v7h-4zm14 0h4v7h-4z"/></g>
